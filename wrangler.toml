name = "auth-demo"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"
compatibility_flags = ["nodejs_compat"]
[[d1_databases]]
  binding = "DB"
  database_name = "auth-demo"
  database_id = "859ac425-2d90-4893-b520-36e8f38a54c2"


# ============================================================
#  部署配置说明（重要）
#  正式环境不要在下面填假值，请按 README.txt 操作：
#  D1 绑定 + 环境变量一律在 Cloudflare 后台配置。
# ============================================================
#
# 【D1 数据库绑定】二选一：
#   A. 后台（推荐）：Pages 项目 → Settings → Bindings → Add binding
#      类型选 D1 database，变量名填 "DB"，选你建好的数据库。
#   B. 命令行：npx wrangler d1 create auth-demo 拿到 database_id 后，
#      用  npx wrangler pages deploy public --project-name auth-demo --d1=DB=<id>
#
# 【环境变量】（后台 Settings → Environment variables，正式环境必须设置）：
#   DEV_MODE          = 0            （必设！否则验证码会回显，等于绕过验证）
#   INIT_TOKEN        = 随机长字符串  （必设！初始化接口的口令）
#   BREVO_API_KEY     = 从 .dev.vars 复制
#   MAIL_FROM         = stylex666666@gmail.com
#   MAIL_FROM_NAME    = 授权平台

#
# 注：本文件不再包含 [[d1_databases]] 假 ID 和 [vars]，避免线上误用。
